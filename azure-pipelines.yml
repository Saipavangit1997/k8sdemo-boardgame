# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- dev

resources:
- repo: self

variables:
  dockerRegistryServiceConnection: 'ACR-serviceconnection'
  imageRepository: 'k8sdemoboardgame'
  containerRegistry: 'k8sdemo123.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  subscription-id : '5d8acfa7-16cd-4143-80a5-18125a834acb'
  rg-name: 'testing-eg'
  aks-cluster-name : 'k8sdemocluster'
  group: acr-creds
  System.debug: true

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - script: |
          echo "JAVA_HOME_21_X64 = $JAVA_HOME_21_X64"
          echo "JAVA_HOME_21_X64 = $JAVA_HOME_21_X64"
          export JAVA_HOME=$JAVA_HOME_21_X64
          export PATH=$JAVA_HOME/bin:$PATH
          java -version
      displayName: "Use JDK 21"

    - task: SonarQubePrepare@7
      inputs:
       SonarQube: 'sonarqube-serviceconnection'
       scannerMode: 'other'
       configMode: 'manual'
       extraProperties: |
        sonar.projectKey=BoardGame
        sonar.projectName=BoardGame
        sonar.sourceEncoding=UTF-8
        sonar.exclusions=**/*.bin
    

    - task: Maven@4
      inputs:
         azureSubscription: 'azureserviceconnection'
         mavenPomFile: 'pom.xml'
         publishJUnitResults: true
         testResultsFiles: '**/surefire-reports/TEST-*.xml'
         javaHomeOption: 'JDKVersion'
         jdkVersionOption: '21'         
         jdkArchitectureOption: 'x64'
         mavenVersionOption: 'Default'
         mavenAuthenticateFeed: false
         effectivePomSkip: false
         sonarQubeRunAnalysis: true
         sqMavenPluginVersionChoice: 'latest'
      
    - task: SonarQubeAnalyze@7
      displayName: "Run SonarQubeAnalyze"

    - task: SonarQubePublish@7
      inputs:
        pollingTimeoutSec: '300'

    - task: sonar-buildbreaker@8
      inputs:
       SonarQube: 'sonarqube-serviceconnection'
      displayName: "Sonaranalaysis fail or pass"


    - script: ls -al && pwd && rm -rf $(Build.SourcesDirectory)/.m2/settings.xml
      displayName: 'List Files & Current Working Directory'
    - task: DownloadSecureFile@1
      inputs:
        secureFile: 'settings.xml'
      displayName: 'Download setting.xml'
    - task: CopyFiles@2
      inputs:
        SourceFolder: '$(Agent.TempDirectory)'
        Contents: 'settings.xml'
        TargetFolder: '$(Build.SourcesDirectory)/.m2'
      displayName: 'Copy to settings.xml file to .m2 folder'

    - task: Maven@4
      displayName: Build and Deploy to Nexus
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean deploy'        
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '21'
        jdkArchitectureOption: 'x64'
        mavenVersionOption: 'Default'
        mavenAuthenticateFeed: false
        effectivePomSkip: false
        options: '--settings $(Build.SourcesDirectory)/.m2/settings.xml'


    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'azureserviceconnection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az account set --subscription $(subscription-id)
          az aks update --resource-group $(rg-name) --name $(aks-cluster-name) --api-server-authorized-ip-ranges ""
          az aks get-credentials --resource-group $(rg-name) --name $(aks-cluster-name)
          kubectl get nodes
      displayName: "Login to AKS cluster"

    - script: chmod +x ./create-acr-secret.sh
      displayName: "Make create-acr-secret.sh executable"

    - task: Bash@3
      displayName: "Run ACR secret creation script"
      inputs:
        filePath: ./create-acr-secret.sh
      env:
        DOCKER_SERVER: "$(DOCKER_SERVER)"
        DOCKER_USERNAME: "$(DOCKER_USERNAME)"
        DOCKER_PASSWORD: "$(DOCKER_PASSWORD)"
        DOCKER_EMAIL: "$(DOCKER_EMAIL)"

    - task: KubernetesManifest@1
      inputs:
        action: 'deploy'
        connectionType: 'azureResourceManager'
        azureSubscriptionConnection: 'azureserviceconnection'
        azureResourceGroup: 'testing-eg'
        kubernetesCluster: 'k8sdemocluster'
        useClusterAdmin: true
        manifests: 'deployment-service.yml'
        imagePullSecrets: 'acr-secret'
        containers: |
          k8sdemo123.azurecr.io/k8sdemoboardgame:$(tag)