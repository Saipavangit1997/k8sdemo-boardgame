# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- dev

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: '1526279c-203c-478e-8c23-ec958f89ea49'
  imageRepository: 'ksdemoboardgame'
  containerRegistry: 'k8sdemo123.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - script: |
          echo "JAVA_HOME_21_X64 = $JAVA_HOME_21_X64"
          echo "JAVA_HOME_21_X64 = $JAVA_HOME_21_X64"
          export JAVA_HOME=$JAVA_HOME_21_X64
          export PATH=$JAVA_HOME/bin:$PATH
          java -version
      displayName: "Use JDK 21"
    - script: |
       mvn -version
      displayName: "Check Maven version"
    - task: SonarQubePrepare@7
      inputs:
       SonarQube: 'SonarQubeAnalysis'
       scannerMode: 'other'
    - task: SonarQubePublish@7
      inputs:
        pollingTimeoutSec: '300'
    - task: Maven@4
      inputs:
         azureSubscription: 'Azuredemoserviceconnection'
         mavenPomFile: 'pom.xml'
         publishJUnitResults: true
         testResultsFiles: '**/surefire-reports/TEST-*.xml'
         javaHomeOption: 'JDKVersion'
         mavenVersionOption: 'Default'
         mavenAuthenticateFeed: false
         effectivePomSkip: false
         sonarQubeRunAnalysis: true
         sqMavenPluginVersionChoice: 'latest'
    - task: sonar-buildbreaker@8
      inputs:
       SonarQube: 'SonarQubeAnalysis'
      displayName: "Sonaranalaysis fail or pass"

    - script: | 
        mvn versions:set -DnewVersion=Dev-2.0.$(Build.BuildId)
        mvn clean package deploy
      displayName: 'Maven build and push to nexus'
      
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: '$(Build.BuildNumber)'
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'Azuredemoserviceconnection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az account set --subscription $subscription-id
          az aks get-credentials --resource-group $rg-name --name $aks-cluster-name
      displayName: "Login to AKS cluster"
    - task: KubernetesManifest@1
      inputs:
        action: 'deploy'
        connectionType: 'azureResourceManager'
        azureSubscriptionConnection: 'Azuredemoserviceconnection'
        azureResourceGroup: 'testing-eg'
        kubernetesCluster: 'k8sdemocluster'
        useClusterAdmin: true
        manifests: 'deployment-service.yml'
        imagePullSecrets: 'testing'